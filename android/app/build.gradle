plugins {
    id 'com.android.application'
}

android {
    namespace 'co.salmaa.ruta'
    compileSdk 35

    defaultConfig {
        applicationId 'co.salmaa.ruta'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
        // Dirección publicada de la app web. Se puede cambiar con -PappUrl=https://...
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('appUrl') ?: 'https://salma20-beta.vercel.app/'}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Diálogo de Google «Activa la ubicación del dispositivo» al iniciar o reanudar la ruta.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
